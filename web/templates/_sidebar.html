<aside class="sidebar">
  <header class="sidebar-header">
    <a class="brand" href="/app">Mission Dashboard</a>
    <div class="meta">{{ user.username }} · {{ user.rol }}</div>
  </header>
  <nav aria-label="Navegación principal">
    <a href="/app" class="{% if request.url.path.rstrip('/') == '/app' %}active{% endif %}"{% if request.url.path.rstrip('/') == '/app' %} aria-current="page"{% endif %}>🏠 Control de mando</a>
    <a href="/app/coach" class="{% if '/coach' in request.url.path %}active{% endif %}"{% if '/coach' in request.url.path %} aria-current="page"{% endif %}>🤖 Coach</a>
    <a href="/app/asistente" class="{% if '/asistente' in request.url.path %}active{% endif %}"{% if '/asistente' in request.url.path %} aria-current="page"{% endif %}>💬 Alma</a>
    <a href="/app/planificador" class="{% if '/planificador' in request.url.path %}active{% endif %}"{% if '/planificador' in request.url.path %} aria-current="page"{% endif %}>🗓️ Semana</a>
    <a href="/app/billing" class="{% if '/billing' in request.url.path %}active{% endif %}"{% if '/billing' in request.url.path %} aria-current="page"{% endif %}>💳 Plan</a>
    <a href="/app/usuarios" class="{% if '/usuarios' in request.url.path %}active{% endif %}"{% if '/usuarios' in request.url.path %} aria-current="page"{% endif %}>🔐 Usuarios</a>
    {% if modulos_nav is defined %}
      {% for m in modulos_nav %}
        <a href="{{ m.href }}" class="{% if not m.activo %}dim{% endif %}{% if request.url.path == m.href %} active{% endif %}"{% if request.url.path == m.href %} aria-current="page"{% endif %}>
          {{ m.emoji }} {{ m.nombre }}
        </a>
      {% endfor %}
    {% endif %}
  </nav>
  <form class="sidebar-footer" method="post" action="/logout">
    <button class="btn secondary block" type="submit">Cerrar sesión</button>
  </form>
</aside>
