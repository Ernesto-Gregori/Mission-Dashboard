<aside class="sidebar">
  <header class="sidebar-header">
    <a class="brand" href="/app">Mission Dashboard</a>
    <div class="meta">{{ user.username }} · {{ user.rol }}</div>
  </header>
  <nav aria-label="Navegación principal" class="app-nav">
    {% if nav_groups is defined and nav_groups %}
      {% for group in nav_groups %}
      <div class="nav-group">
        <p class="nav-group-label">{{ group.label }}</p>
        {% for item in group.links %}
        <a href="{{ item.href }}" data-hub="{{ item.id }}" class="{% if item.active %}active{% endif %}"{% if item.active %} aria-current="page"{% endif %}>{{ item.label }}</a>
        {% endfor %}
      </div>
      {% endfor %}
    {% else %}
    <a href="/app" class="{% if request.url.path.rstrip('/') == '/app' %}active{% endif %}"{% if request.url.path.rstrip('/') == '/app' %} aria-current="page"{% endif %}>Hoy</a>
    <a href="/app/coach">Cuenta</a>
    {% endif %}
  </nav>
  <div class="sidebar-footer">
    <form method="post" action="/app/tema">
      <input type="hidden" name="theme" value="{% if theme == 'light' %}dark{% else %}light{% endif %}" />
      <input type="hidden" name="next" value="{{ request.url.path }}" />
      <button class="btn secondary block" type="submit">
        {% if theme == 'light' %}Tema oscuro{% else %}Tema claro{% endif %}
      </button>
    </form>
    <form method="post" action="/logout">
      <button class="btn secondary block" type="submit">Cerrar sesión</button>
    </form>
  </div>
</aside>
