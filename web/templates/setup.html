{% extends "base.html" %}
{% block body %}
<main class="auth-wrap" id="main-content" tabindex="-1">
  <div class="card">
    <h1>Primer acceso</h1>
    <p class="muted">Crea el usuario administrador. La contraseña se guarda con hash (mín. 8).</p>
    {% if error %}<div class="flash-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/setup">
      <label for="setup-username">Usuario</label>
      <input id="setup-username" name="username" value="admin" autocomplete="username" required />
      <label for="setup-password">Contraseña</label>
      <input id="setup-password" name="password" type="password" autocomplete="new-password" required minlength="8" />
      <label for="setup-password-confirm">Repetir contraseña</label>
      <input id="setup-password-confirm" name="password2" type="password" autocomplete="new-password" required minlength="8" />
      <button class="btn block" type="submit">Crear y entrar</button>
    </form>
  </div>
</main>
{% endblock %}
