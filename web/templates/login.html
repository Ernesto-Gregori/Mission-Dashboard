{% extends "base.html" %}
{% block body %}
<main class="auth-wrap" id="main-content" tabindex="-1">
  <div class="card">
    <h1>Mission Dashboard</h1>
    <p class="muted">Acceso privado — FastAPI + HTMX</p>
    {% if error %}<div class="flash-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="login-username">Usuario</label>
      <input id="login-username" name="username" autocomplete="username" required />
      <label for="login-password">Contraseña</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required />
      <button class="btn block" type="submit">Entrar</button>
    </form>
    <p class="muted auth-legal"><a href="/privacidad">Privacidad</a> · <a href="/terminos">Términos</a></p>
    <nav class="muted lang-switch" aria-label="Idioma">
      <a href="/idioma?lang=es&amp;next=/login" hreflang="es" lang="es"{% if lang != 'en' %} aria-current="page"{% endif %}>Español</a>
      <span aria-hidden="true"> · </span>
      <a href="/idioma?lang=en&amp;next=/login" hreflang="en" lang="en"{% if lang == 'en' %} aria-current="page"{% endif %}>English</a>
    </nav>
  </div>
</main>
{% endblock %}
