<h1>🤖 Coach Mission Dashboard</h1>
<p class="muted">{{ plan_resumen }}{% if tope %} · Free: máx. {{ tope }} módulos{% endif %}</p>
{% if error %}<div class="flash-error" role="alert">{{ error }}</div>{% endif %}

<form class="coach-profile-form" method="post" action="/app/coach/perfil">
  <label for="coach-name">¿Cómo te llamo?</label>
  <input id="coach-name" name="nombre" value="{{ user.username }}" required />

  <label for="coach-situation">¿En qué etapa estás?</label>
  <textarea id="coach-situation" name="situacion" rows="3" placeholder="Ej: recién casado, estudiante…"></textarea>

  <label for="coach-goals">¿Qué quieres mejorar o registrar?</label>
  <textarea id="coach-goals" name="objetivos" rows="3" placeholder="Ej: finanzas, relación, hábitos…"></textarea>

  <fieldset class="coach-area-grid">
    <legend class="form-label">Áreas importantes ahora</legend>
    {% for a in areas %}
    <label class="check-row" for="coach-area-{{ a }}">
      <input id="coach-area-{{ a }}" type="checkbox" name="areas" value="{{ a }}" {% if a == 'espiritual' %}checked{% endif %} />
      {{ a }}
    </label>
    {% endfor %}
  </fieldset>

  <label for="coach-time">Tiempo al día para el sistema</label>
  <select id="coach-time" name="tiempo">
    <option>5-10 min</option>
    <option selected>15-20 min</option>
    <option>30+ min</option>
  </select>

  <label for="coach-notes">Algo más (opcional)</label>
  <input id="coach-notes" name="notas" />

  <div class="form-actions">
    <button class="btn block" type="submit">Continuar →</button>
  </div>
</form>
