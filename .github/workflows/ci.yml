# CI — tests de humo Mission Dashboard
name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify requirements.txt is UTF-8
        run: |
          python - <<'PY'
          raw = open("requirements.txt", "rb").read()
          assert not raw.startswith(b"\xff\xfe") and not raw.startswith(b"\xfe\xff"), "UTF-16 BOM"
          assert b"\x00" not in raw[:200], "null bytes — probablemente UTF-16"
          text = raw.decode("utf-8")
          assert "streamlit" in text
          print("requirements.txt OK (UTF-8)")
          PY

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        run: pytest -q tests/
        env:
          TURSO_URL: ""
          TURSO_TOKEN: ""

      - name: Compile deploy helper
        run: python -m py_compile scripts/verify_deploy.py
