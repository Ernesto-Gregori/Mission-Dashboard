# Mantiene despierta la app en Streamlit Community Cloud.
# FASE 3: desactivado por defecto (la app canónica es FastAPI en Railway).
# Solo corre con workflow_dispatch si aún tienes Streamlit vivo.
#
# Setup (legado):
# 1. Repo → Settings → Secrets → STREAMLIT_APP_URL
# 2. Actions → Keep Streamlit Awake → Run workflow

name: Keep Streamlit Awake

on:
  # schedule desactivado tras cutover FastAPI — reactivar solo si Streamlit sigue en prod
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check STREAMLIT_APP_URL secret
        id: check
        env:
          APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta STREAMLIT_APP_URL (legado). Si ya cortaste Streamlit, ignora este workflow."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "URL configurada (no se imprime por seguridad)."
          fi

      - name: Install Playwright (Chromium)
        if: steps.check.outputs.configured == 'true'
        run: |
          pip install --quiet playwright==1.49.1
          playwright install --with-deps chromium

      - name: Wake Streamlit app
        if: steps.check.outputs.configured == 'true'
        env:
          APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          python << 'PY'
          import os, sys, time
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"].strip().rstrip("/")
          if not url.startswith("http"):
              print("STREAMLIT_APP_URL inválida", file=sys.stderr)
              sys.exit(1)

          print(f"Visitando app…")
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=120_000)
              time.sleep(3)

              for label in (
                  "Yes, get this app back up!",
                  "Yes, get this app back up",
                  "Get this app back up",
              ):
                  btn = page.get_by_role("button", name=label)
                  try:
                      if btn.count() and btn.first.is_visible():
                          print(f"App dormida — clic en: {label}")
                          btn.first.click()
                          page.wait_for_timeout(15_000)
                          break
                  except Exception as e:
                      print(f"Botón '{label}': {e}")

              page.wait_for_timeout(20_000)
              title = page.title()
              print(f"Listo. title={title!r}")
              browser.close()
          PY
